<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products | Ekantra Admin</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="admin-layout">

<!-- Sidebar -->

<aside class="sidebar">

<h2>Ekantra</h2>

<ul>

<li><a href="dashboard.html">📊 Dashboard</a></li>

<li class="active"><a href="products.html">📦 Products</a></li>

<li><a href="orders.html">🛒 Orders</a></li>

<li><a href="customers.html">👥 Customers</a></li>

<li><a href="revenue.html">💰 Revenue</a></li>

<li><a href="settings.html">⚙ Settings</a></li>

<li><a href="login.html">🚪 Logout</a></li>

</ul>

</aside>

<!-- Main -->

<main class="main-content">

<header class="topbar">

<h1>Products Management</h1>

<div class="admin-user">

Administrator

</div>

</header>

<section class="content">

<div class="content-top">

<input
type="text"
placeholder="Search Product..."
id="searchProduct">

<button id="addProductBtn">

+ Add Product

</button>

</div>

<table class="product-table">

<thead>

<tr>

<th>Name</th>

<th>Category</th>

<th>Version</th>

<th>Price</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="productsTableBody">

</tbody>


</table>

</section>


<!-- ==========================================
     ADD PRODUCT MODAL
========================================== -->

<div id="productModal" class="modal">

<div class="modal-content">

<span class="close-modal">&times;</span>

<h2 id="productModalTitle">Add New Product</h2>

<form id="productForm">
     <input type="hidden" id="editingProductId">

<input
type="text"
id="productName"
placeholder="Product Name"
required>

<select id="productCategory">

<option>Grammar</option>

<option>MA Notes</option>

<option>BA Notes</option>

<option>WBSSC</option>

<option>IGNOU</option>

<option>NSOU</option>

<option>Assignment</option>

<option>Bundle</option>

</select>

<input
type="text"
id="productVersion"
placeholder="Version (Example: 1.0)"
required>

<input
type="number"
id="productPrice"
placeholder="Price"
required>

<textarea
id="productDescription"
placeholder="Description"></textarea>

<input
type="file"
id="productImage"
accept="image/*">

<input
type="file"
id="productPDF"
accept=".pdf">

<select id="productStatus">

<option>Active</option>

<option>Inactive</option>

<option>Archived</option>

</select>

<button type="submit" id="saveProductBtn">

Save Product

</button>

</form>

</div>

</div>

</main>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
